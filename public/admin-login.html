<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Carré Gym</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <div class="login-box">
    <div class="logo"></div>
    <h1>Carré <span>Gym</span></h1>
    <p>Tableau de bord administrateur</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Entrez votre mot de passe" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Se connecter</button>
    </form>

    <p class="error-msg" id="errorMsg">Mot de passe incorrect</p>
  </div>

  <script>
    // Si déjà connecté, rediriger
    if (localStorage.getItem('cg_token')) {
      window.location.href = '/admin/dashboard';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Connexion...';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem('cg_token', data.token);
          window.location.href = '/admin/dashboard';
        } else {
          throw new Error(data.error || 'Erreur');
        }
      } catch (err) {
        errorMsg.textContent = err.message || 'Mot de passe incorrect';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
